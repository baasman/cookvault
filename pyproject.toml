[project]
name = "app"
version = "0.1.0"
description = "Backend API for Cookle - OCR and recipe digitization platform"
authors = [{ name = "Boudewijn", email = "boudeyz@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-migrate>=4.0.0",
    "flask-cors>=4.0.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "anthropic>=0.25.0",
    "redis>=5.0.0",
    "celery[redis]>=5.3.0",
    "marshmallow>=3.20.0",
    "werkzeug>=3.0.0",
    "numpy>=2.3.1",
    "scikit-image>=0.25.2",
    "flask-bcrypt>=1.0.1",
    "requests>=2.32.4",
    "gunicorn>=21.2.0",
    "flask-talisman>=1.1.0",
    "flask-limiter>=3.5.0",
    "psycopg==3.2.9",
    "pdfplumber>=0.11.7",
    "pdf2image>=1.17.0",
    "pyjwt>=2.10.1",
    "flask-jwt-extended>=4.7.1",
    "stripe>=12.4.0",
    "cloudinary>=1.44.1",
    "reportlab>=4.0.0",
    "pypdf>=3.17.0",
    "locust>=2.40.5",
    "psutil>=5.9.6",
    "resend>=2.0.0",
    "twilio>=9.0.0",
    "phonenumbers>=8.13.0",
    "psycopg-binary>=3.3.2",
    "pyyaml>=6.0.2",
    "sentry-sdk[flask]>=2.51.0",
    "beautifulsoup4>=4.12.0",
    "openai>=1.0.0",
    "yt-dlp>=2025.1.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-flask>=1.3.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "sqlalchemy>=2.0.41",
    "sqlalchemy-stubs>=0.4",
    "pytest>=8.4.0",
    "honcho>=2.0.0",
    "pytest-cov>=7.1.0",
]

[project.scripts]
cookbook-db = "cookbook_db_utils.cli:main"
cookbook-db-manager = "cookbook_db_utils.db_manager:main"
cookbook-db-migrate = "cookbook_db_utils.migrate_manager:main"
cookbook-db-seed = "cookbook_db_utils.seed_data:main"
cookbook-db-utils = "cookbook_db_utils.db_utils:main"
cookbook-db-dev = "cookbook_db_utils.dev_helpers:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
sources = { "cookbook_db_utils" = "backend/cookbook_db_utils" }

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = [
    "D101",    # Missing docstring in public class
    "E501",    # Line too long (handled by formatter where possible)
    "F821",    # Undefined name (false positives for SQLAlchemy forward refs)
    "C901",    # Function too complex (acceptable for now)
]

[tool.ruff.lint.per-file-ignores]
"backend/app/api/__init__.py" = ["F401", "E402"]  # Re-exports for Flask blueprint registration
"backend/cookbook_db_utils/*.py" = ["F401"]  # Optional imports for seeding scripts
"backend/wsgi.py" = ["E402"]  # Import after env setup is intentional
"backend/celery_worker.py" = ["E402"]  # Import after env setup is intentional

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disable_error_code = ["import-untyped", "no-untyped-def"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--ignore=tests/test_youtube_api.py --ignore=tests/test_youtube_service.py"

[tool.coverage.run]
source = ["backend/app"]

[tool.coverage.report]
fail_under = 30
show_missing = false
skip_empty = true

[tool.pylint.messages_control]
disable = ["C0114", "C0115", "C0116"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
load-test = [
    "locust>=2.17.0",
    "pyyaml>=6.0.1",
    "aiohttp>=3.9.0",
    "pandas>=2.1.0",
    "matplotlib>=3.7.0",
    "plotly>=5.18.0",
    "seaborn>=0.13.0",
    "psutil>=5.9.6",
    "py-cpuinfo>=9.0.0",
    "memory-profiler>=0.61.0",
    "jinja2>=3.1.2",
    "markdown>=3.5.0",
    "faker>=20.0.0",
    "scipy>=1.11.0",
    "colorlog>=6.8.0",
    "rich>=13.7.0",
]
