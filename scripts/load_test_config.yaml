# Load Test Configuration for Cookbook Creator
# This file defines test scenarios, data, and parameters

# Test data configuration
test_data:
  # Single image for standard uploads
  single_image: backend/scripts/seed_data/brussel-sprouts-browned-butter-black-garlic.jpg

  # Multiple images for multi-upload testing
  multi_images:
    - backend/scripts/seed_data/bolognese-1.jpg
    - backend/scripts/seed_data/bolognese-2.jpg

# Test scenarios
scenarios:
  - name: baseline
    description: "Baseline test with moderate load"
    users: 10
    spawn_rate: 2
    duration: 300  # 5 minutes
    user_class: StandardUser

  - name: stress_test
    description: "Stress test with high concurrent users"
    users: 50
    spawn_rate: 5
    duration: 600  # 10 minutes
    user_class: AggressiveUser

  - name: spike_test
    description: "Spike test with sudden load increase"
    stages:
      - users: 5
        spawn_rate: 1
        duration: 60
      - users: 50
        spawn_rate: 10
        duration: 120
      - users: 5
        spawn_rate: -5
        duration: 60

  - name: endurance_test
    description: "Long-running test for memory leak detection"
    users: 20
    spawn_rate: 2
    duration: 3600  # 1 hour
    user_class: StandardUser

  - name: burst_pattern
    description: "Simulate burst traffic patterns"
    users: 30
    spawn_rate: 3
    duration: 900  # 15 minutes
    user_class: BurstUser

# Performance thresholds (for alerting)
thresholds:
  max_response_time_ms: 5000
  max_error_rate_percent: 5
  min_rps: 10

# Memory monitoring settings
memory_monitoring:
  enabled: true
  interval_seconds: 30
  alert_threshold_mb: 1000

# Database monitoring
database_monitoring:
  enabled: true
  max_connections: 100
  alert_threshold_percent: 80

# OCR processing monitoring
ocr_monitoring:
  enabled: true
  max_queue_depth: 50
  processing_timeout_seconds: 30

# Report settings
reporting:
  generate_html: true
  generate_csv: true
  include_charts: true
  chart_types:
    - response_time_distribution
    - requests_per_second
    - error_rate_over_time
    - memory_usage_trend
    - user_count_progression

# Test environment settings
environment:
  base_url: "http://localhost:5001"
  api_prefix: "/api"
  timeout_seconds: 30
  verify_ssl: false

# Rate limiting configuration
rate_limiting:
  respect_limits: true
  max_requests_per_user_per_minute: 60

# Logging configuration
logging:
  level: INFO
  log_file: "scripts/load_test.log"
  log_format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Custom headers (if needed)
custom_headers:
  X-Test-Header: "LoadTest"
  User-Agent: "CookbookCreator-LoadTest/1.0"